name: Feature request
description: Suggest a new command, flag, or site adapter
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or workflow, not just the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed command or behaviour
      description: Example invocation and output, if you have one. Check `docs/commands.md` for what is intentionally not implemented.
