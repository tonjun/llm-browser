[project]
name = "llm-browser"
version = "0.1.0"
description = "A stealth browser automation CLI for LLM agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Antonio Banaag II", email = "tonjun@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "seleniumbase>=4.52.4",
    "trafilatura>=1.12",
    "typer>=0.27.2",
]

[project.scripts]
llm-browser = "llm_browser.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.5",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
